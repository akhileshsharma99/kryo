[project]
name = "kryo-modal"
version = "0.1.0"
description = "Modal deployment for cold start benchmarks"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.3.0",
    "numpy>=2.4.0",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.19.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["T201"]  # Allow print for CLI output

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["modal.*", "numpy.*"]
ignore_missing_imports = true
