name: Python Lint
description: Run ruff check, ruff format, and mypy on a Python project

inputs:
  working-directory:
    description: Directory containing the Python project
    required: true

outputs:
  skipped:
    description: Whether the checks were skipped due to no changes
    value: ${{ steps.changes.outputs.changed == 'false' }}

runs:
  using: composite
  steps:
    - name: Check for changes
      id: changes
      uses: ./ci/actions/check-changes
      with:
        path: ${{ inputs.working-directory }}

    - name: Install uv
      if: steps.changes.outputs.changed == 'true'
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Set up Python
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      run: uv python install 3.11

    - name: Install dependencies
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync

    - name: Ruff check
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff check .

    - name: Ruff format
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff format --check .

    - name: Mypy
      if: steps.changes.outputs.changed == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run mypy .
