name: Python Lint
description: Run ruff check, ruff format, and mypy on a Python project

inputs:
  working-directory:
    description: Directory containing the Python project
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      shell: bash
      run: uv python install 3.11

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync

    - name: Ruff check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff check .

    - name: Ruff format
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run ruff format --check .

    - name: Mypy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run mypy .
