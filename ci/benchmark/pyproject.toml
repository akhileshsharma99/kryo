[project]
name = "kryo-lambda-benchmark"
version = "0.4.1"
description = "Provision Lambda Cloud GPUs and run Kryo benchmarks"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.19.0",
    "ruff>=0.9.0",
    "types-pyyaml>=6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
    "S",
]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["T201", "S603", "S310", "S607", "E402"]
"scheduler.py" = ["T201", "S603", "S310", "S607", "S108"]
"snapshots.py" = ["S108"]
"golden.py" = ["S108"]
"providers/*.py" = ["T201", "S603", "S310", "S607"]
"test_*.py" = ["S101", "S108", "E402"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "."
