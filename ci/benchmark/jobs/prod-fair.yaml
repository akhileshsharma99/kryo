# Production-fair probes on H100. Weights already on disk; page cache dropped.
# Cap is 1 so this cannot fan out to multiple expensive GPUs.

idle_timeout: 10m
provider: lambda
caps:
  gpu_1x_h100_pcie: 1
golden:
  mode: setup
snapshots:
  store: local
jobs:
  - scenario: qwen7
    gpu: gpu_1x_h100_pcie
    samples: 3
    timeout: 600
  - scenario: torch_compile
    gpu: gpu_1x_h100_pcie
    samples: 3
    timeout: 900
  - scenario: vllm_engine
    gpu: gpu_1x_h100_pcie
    samples: 3
    timeout: 900
