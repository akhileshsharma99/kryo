# Tiny models on A10, 7B/32B on H100 SXM5 (PCIe is often out of stock).
# Golden setup is reused across VMs. CRIU dump is once per VM, then timed runs.

idle_timeout: 10m
provider: lambda
caps:
  gpu_1x_a10: 1
  gpu_1x_h100_sxm5: 1
golden:
  mode: tarball
  store: filesystem
  filesystem: kryo-golden
snapshots:
  store: local
jobs:
  - scenario: torch_cuda
    gpu: gpu_1x_a10
    samples: 10
    timeout: 90
  - scenario: yolo
    gpu: gpu_1x_a10
    samples: 10
    timeout: 90
  - scenario: qwen
    gpu: gpu_1x_a10
    samples: 10
    timeout: 90
  - scenario: whisper
    gpu: gpu_1x_a10
    samples: 10
    timeout: 90
  - scenario: qwen7
    gpu: gpu_1x_h100_sxm5
    samples: 3
    timeout: 600
  - scenario: torch_compile
    gpu: gpu_1x_h100_sxm5
    samples: 3
    timeout: 900
  - scenario: vllm_engine
    gpu: gpu_1x_h100_sxm5
    samples: 3
    timeout: 900
  - scenario: qwen32
    gpu: gpu_1x_h100_sxm5
    samples: 2
    timeout: 1200
