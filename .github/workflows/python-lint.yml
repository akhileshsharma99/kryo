name: Python Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./ci/actions/python-lint
        id: lint
        with:
          working-directory: python
      - name: Tests
        if: steps.lint.outputs.skipped != 'true'
        working-directory: python
        run: uv run python -m unittest discover -s tests

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./ci/actions/python-lint
        with:
          working-directory: benchmarks

  lambda-benchmark:
    name: Lambda Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./ci/actions/python-lint
        id: lint
        with:
          working-directory: ci/benchmark
      - name: Job schema tests
        if: steps.lint.outputs.skipped != 'true'
        working-directory: ci/benchmark
        run: uv run python -m unittest discover -s . -p 'test_*.py'
