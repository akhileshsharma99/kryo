name: Python Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ci/actions/python-lint
        with:
          working-directory: benchmarks

  cloud-benchmark-runner:
    name: Cloud Benchmark Runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./ci/actions/python-lint
        with:
          working-directory: ci/benchmark-runner
