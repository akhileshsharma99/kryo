name: GPU Benchmark

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "all (parallel A10 + H100), or a single shard (a10.yaml, h100.yaml)"
        required: false
        default: "all"
      tag:
        description: Release tag to publish results to (empty = artifacts only)
        required: false
        default: ""

# Do not use `release: published`. release-please creates the GitHub Release
# with GITHUB_TOKEN, and GitHub drops those events so they cannot recurse.
# The Release workflow dispatches this one instead (workflow_dispatch is allowed).

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gpu-benchmark
  cancel-in-progress: false

jobs:
  a10:
    name: A10
    if: inputs.jobs == 'all' || inputs.jobs == 'a10.yaml'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Run A10 benchmarks
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
          BENCH_RELEASE_TAG: ${{ inputs.tag }}
          BENCH_MAX_SECONDS: "3600"
        run: |
          export BENCH_GIT_SHA="$(git rev-parse HEAD)"
          uv sync --directory ci/benchmark
          uv run --directory ci/benchmark python -u run.py \
            --jobs jobs/a10.yaml \
            --output ../../benchmarks/results/a10.json

      - name: Upload A10 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-a10
          path: benchmarks/results/a10.json
          if-no-files-found: ignore

  h100:
    name: H100
    if: inputs.jobs == 'all' || inputs.jobs == 'h100.yaml'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Run H100 benchmarks
        env:
          LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
          BENCH_RELEASE_TAG: ${{ inputs.tag }}
          BENCH_MAX_SECONDS: "14400"
        run: |
          export BENCH_GIT_SHA="$(git rev-parse HEAD)"
          uv sync --directory ci/benchmark
          uv run --directory ci/benchmark python -u run.py \
            --jobs jobs/h100.yaml \
            --output ../../benchmarks/results/h100.json

      - name: Upload H100 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-h100
          path: benchmarks/results/h100.json
          if-no-files-found: ignore

  publish:
    name: Chart and README
    needs: [a10, h100]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download shards
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: benchmark-*
          merge-multiple: true
          path: shards

      - name: Merge, chart, README
        id: format
        run: |
          shopt -s nullglob
          FILES=(shards/*.json)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no shard JSON"
            exit 0
          fi
          python3 ci/benchmark/format_results.py \
            --merge "${FILES[@]}" \
            --json benchmarks/results/latest.json \
            --svg benchmarks/results/charts/cold-vs-kryo.svg \
            --markdown "$RUNNER_TEMP/kryo-benchmarks.md" \
            --patch-readme README.md
          if [ -n "${{ inputs.tag }}" ]; then
            cp benchmarks/results/latest.json benchmarks/results/results.json
          fi
          echo "have_json=true" >> "$GITHUB_OUTPUT"

      - name: Upload merged artifacts
        if: always() && steps.format.outputs.have_json == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/results/latest.json
            benchmarks/results/charts/cold-vs-kryo.svg
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        if: always() && inputs.tag != '' && steps.format.outputs.have_json == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp benchmarks/results/latest.json "$RUNNER_TEMP/kryo-benchmarks.json"
          cp benchmarks/results/charts/cold-vs-kryo.svg "$RUNNER_TEMP/kryo-benchmarks.svg"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/kryo-benchmarks.json" \
            "$RUNNER_TEMP/kryo-benchmarks.svg" \
            "$RUNNER_TEMP/kryo-benchmarks.md" \
            --clobber
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes-in.md"
          python3 ci/benchmark/format_results.py \
            --json benchmarks/results/latest.json \
            --notes-in "$RUNNER_TEMP/notes-in.md" \
            --notes-out "$RUNNER_TEMP/notes-out.md" \
            --tag "$TAG" \
            --repo "${{ github.repository }}"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes-out.md"

      - name: Open results PR
        if: always() && inputs.tag != '' && steps.format.outputs.have_json == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          commit-message: "chore: publish GPU benchmark results for ${{ inputs.tag }}"
          title: "chore: publish GPU benchmark results for ${{ inputs.tag }}"
          body: >
            Automated GPU benchmark publish for `${{ inputs.tag }}`.
            Review the README chart and table, then merge.
            This is `chore:` so it will not cut a release.
          branch: ci/benchmark-results-${{ inputs.tag }}
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            README.md
            benchmarks/results/results.json
            benchmarks/results/charts/cold-vs-kryo.svg
