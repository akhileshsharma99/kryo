name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: ci/release-please/config.json
          manifest-file: ci/release-please/manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: kryo-linux-x64
          - target: aarch64-unknown-linux-gnu
            asset: kryo-linux-arm64
            linker: aarch64-linux-gnu-gcc
            extra_apt: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install cross linker
        if: matrix.extra_apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.extra_apt }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          RUSTFLAGS: "-C strip=symbols"
        run: |
          if [ -n "${{ matrix.linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "target/${{ matrix.target }}/release/kryo" "${{ matrix.asset }}"
          gh release upload "${{ needs.release-please.outputs.tag_name }}" "${{ matrix.asset }}"

  crates:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Build
        working-directory: python
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  # GITHUB_TOKEN cannot fire `release: published` on other workflows (GitHub
  # drops those events to prevent recursion). workflow_dispatch is the
  # documented exception, so Release kicks off GPU benches explicitly.
  gpu-benchmark:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch GPU benchmarks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run benchmark.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f jobs=release.yaml \
            -f tag="${{ needs.release-please.outputs.tag_name }}"
