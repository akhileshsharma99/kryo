[project]
name = "benchmarks"
version = "0.3.0"
description = "Kryo with/without snapshot cold-start benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kryo",
    "numpy>=2.4.0",
    "torch>=2.13.0",
    "ultralytics>=8.4.0",
    "transformers>=5.5.0",
    "accelerate>=1.12.0",
]

[tool.uv]
dev-dependencies = [
    "mypy>=1.19.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
kryo = { path = "../python" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "PL",
    "RUF",
    "S",
    "A",
    "DTZ",
    "T10",
    "ICN",
    "PIE",
    "PT",
    "RSE",
    "RET",
    "TID",
    "PTH",
    "PERF",
]

[tool.ruff.lint.per-file-ignores]
"scenarios/*.py" = ["T201", "PLC0415", "E402"]
"runner.py" = ["T201", "S603", "S607", "S108"]
"download_models.py" = ["T201", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["scenarios/", "download_models.py"]
