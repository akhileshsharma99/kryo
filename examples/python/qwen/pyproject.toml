[project]
name = "qwen"
version = "0.2.0"
description = "Qwen example with Kryo checkpointing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kryo",
    "torch>=2.13.0",
    "transformers>=5.5.0",
]

[tool.uv]
constraint-dependencies = [
    "filelock>=3.20.3",
    "idna>=3.15",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "urllib3>=2.7.0",
]

[tool.uv.sources]
kryo = { path = "../../../python" }
