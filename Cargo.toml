[package]
name = "kryo"
version = "0.1.0"
edition = "2024"
description = "Sub-second cold starts for GPU inference"
license = "MIT"
repository = "https://github.com/akhileshsharma/kryo"

[lib]
name = "kryo"
path = "src/lib.rs"

[[bin]]
name = "kryo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
