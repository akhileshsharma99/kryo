[package]
name = "kryo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Sub-second cold starts for GPU inference"
license = "MIT"
repository = "https://github.com/akhileshsharma99/kryo"
homepage = "https://github.com/akhileshsharma99/kryo"
readme = "README.md"
authors = ["Akhilesh Sharma <sharmaninenine@gmail.com>"]
keywords = ["gpu", "inference", "checkpoint", "criu", "cuda"]
categories = ["command-line-utilities"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[lib]
name = "kryo"
path = "src/lib.rs"

[[bin]]
name = "kryo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = { version = "0.3", features = ["extended-siginfo"] }
thiserror = "2.0.18"
